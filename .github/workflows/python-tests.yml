name: Backend and frontend checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend and lint dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint backend
        run: ruff check app tests scripts
      - name: Check AI code formatting
        run: >-
          ruff format --check app/ai app/api/routes/ai.py app/models/bug.py
          app/models/bug_ai_analysis.py tests/test_ai* scripts/seed_ai_eval_bugs.py
      - name: Check Python syntax
        run: python -m compileall -q app tests scripts
      - name: Run backend tests
        run: python -m unittest discover -s tests -v

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Type-check and build frontend
        run: npm run build --prefix frontend
